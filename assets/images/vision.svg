<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-vision-main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <radialGradient id="grad-vision-highlight" cx="30%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff; stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ffffff; stop-opacity:0"/>
    </radialGradient>
    <filter id="shadow-3d" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#grad-vision-main)" filter="url(#shadow-3d)" />
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#grad-vision-highlight)" />
  
  <!-- Compass Body -->
  <circle cx="32" cy="32" r="18" fill="white" fill-opacity="0.15" stroke="white" stroke-width="2" />
  
  <!-- Needle -->
  <path d="M32 18 L36 32 L32 46 L28 32 Z" fill="#f97316">
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="15 32 32" dur="2s" repeatCount="indefinite" additive="sum"/>
    <animateTransform attributeName="transform" type="rotate" from="15 32 32" to="0 32 32" dur="2s" repeatCount="indefinite" additive="sum"/>
  </path>
  <path d="M32 18 L36 32 L32 32 L28 32 Z" fill="#ea580c" />
  <path d="M32 46 L36 32 L32 32 L28 32 Z" fill="#cbd5e1" />
  
  <!-- Center Pin -->
  <circle cx="32" cy="32" r="3" fill="white" />
</svg>